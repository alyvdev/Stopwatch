<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f2ed">
    <meta name="description" content="A simple, precise stopwatch with lap timing.">
    <link rel="stylesheet" href="./assets/Styles/style.css">
    <link rel="stylesheet" href="./assets/Styles/media.css">
    <title>Stopwatch — Keep your pace</title>
</head>

<body>
    <main class="stopwatch">
        <header class="topbar">
            <a class="brand" href="./" aria-label="Stopwatch home">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="13" r="8" />
                        <path d="M12 9v4l2.5 1.5M9 2h6m-3 0v3m5.7 1.3 1.4-1.4" />
                    </svg>
                </span>
                <span>FIELDWORK <span class="brand-divider">/</span> TIME</span>
            </a>
            <span class="top-note">A little more in control.</span>
        </header>

        <section class="timer-panel" aria-labelledby="page-title">
            <div class="panel-heading">
                <div>
                    <p class="eyebrow">YOUR PERSONAL TIMEKEEPER</p>
                    <h1 id="page-title">Stopwatch</h1>
                </div>
                <p class="run-state" aria-live="polite">
                    <span class="state-indicator" aria-hidden="true"></span>
                    <span class="state-label">Ready</span>
                </p>
            </div>

            <div class="clock-wrap">
                <output class="clock" aria-label="Elapsed time">
                    <span class="time-part hours">00</span><span class="time-separator">:</span><span class="time-part minutes">00</span><span class="time-separator">:</span><span class="time-part seconds">00</span><span class="decimal">.</span><span class="time-part hundredths">00</span>
                </output>
                <div class="clock-units" aria-hidden="true">
                    <span>HOURS</span><span>MINUTES</span><span>SECONDS</span><span>1/100 SEC</span>
                </div>
            </div>

            <div class="controls" aria-label="Stopwatch controls">
                <button class="button button-primary start" type="button">Start</button>
                <button class="button button-secondary pause" type="button" disabled>Pause</button>
                <button class="button button-secondary lap" type="button" disabled>Lap</button>
                <button class="button button-reset reset" type="button" disabled>Reset</button>
            </div>

            <p class="shortcut-hint"><kbd>Space</kbd> start / pause <span aria-hidden="true">·</span> <kbd>L</kbd> lap <span aria-hidden="true">·</span> <kbd>R</kbd> reset</p>

            <section class="laps" aria-labelledby="laps-title">
                <div class="laps-heading">
                    <div class="laps-title-wrap">
                        <h2 id="laps-title">Lap times</h2>
                        <span class="lap-count">0</span>
                    </div>
                    <button class="clear-laps" type="button" disabled>Clear laps</button>
                </div>
                <div class="lap-columns" aria-hidden="true">
                    <span>Lap</span>
                    <span>Split time</span>
                    <span>Total time</span>
                </div>
                <ol class="lap-list" aria-live="polite" aria-relevant="additions removals">
                    <li class="empty-state">Your laps will show up here.</li>
                </ol>
            </section>
        </section>

        <footer class="footer">
            <span>Made for the moments that matter.</span>
            <span>FIELDWORK <span class="footer-dot">·</span> TIME</span>
        </footer>
    </main>
    <script src="./assets/JS/index.js"></script>
</body>

</html>
